<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusFlowAI - AI Campus Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
          document.documentElement.style.backgroundColor = '#080D12';
          document.documentElement.style.color = '#F4F7F8';
        }
      })();
    </script>
    <style>
      html, body { margin: 0; background-color: #FFFFFF; color: #1A1F36; }
      html.dark, html.dark body { background-color: #080D12 !important; color: #F4F7F8 !important; }
      html.dark aside { background-color: #0C1218 !important; }
      html.dark header { background-color: #111920 !important; border-color: #202C35 !important; }
      html.dark main { background-color: #080D12 !important; }
      html.dark input:not([type="hidden"]) { background-color: #0D151C !important; color: #F4F7F8 !important; border-color: #202C35 !important; }
      html.dark nav a, html.dark nav button { color: #A6B3BE !important; }
      html.dark nav a.active, html.dark nav button.active { background-color: #10332F !important; color: #00A88F !important; }
      #root[data-ready="false"] { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root" data-ready="false"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
