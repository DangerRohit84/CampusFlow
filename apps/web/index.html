<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusFlow — Campus OS</title>
    <!-- High-scale head: preconnect + dns-prefetch + preload fonts (Notion/Vercel pattern for first-paint) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <!-- preload font stylesheet with swap; display=swap avoids FOIT (like Shopify/StackOverflow) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700;9..144,800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"></noscript>
    <script>
      (function() {
        var theme = localStorage.getItem('theme');
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>
      html, body { margin:0; background:#FEFCF7; color:#0C1218; }
      html.dark, html.dark body { background:#0B1216 !important; color:#F1F5F9 !important; }
      #root[data-ready="false"] { visibility:hidden; }
      /* High-scale list perf: content-visibility for offscreen cards (Notion/Instagram pattern) */
      .due-slip, .paper { content-visibility: auto; contain-intrinsic-size: auto 220px; }
    </style>
  </head>
  <body>
    <div id="root" data-ready="false"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
