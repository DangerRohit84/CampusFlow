server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # gzip — popular-site parity: compress text assets (JS/CSS/SVG/JSON)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss image/svg+xml font/ttf font/otf;

    # Security headers
    # NOTE: No HSTS on :80 — HSTS is HTTPS-only per MDN and ignored on plain HTTP.
    # Enable the line below ONLY on the :443 TLS server block.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # X-XSS-Protection removed — deprecated, can introduce XSS vectors in legacy browsers.
    # CSP: inline theme script allowlisted via sha256 hash (no 'unsafe-inline' for scripts).
    # Regenerate hash after editing apps/web/index.html inline <script>:
    #   node -e "const c=require('crypto'),f=require('fs');const h=f.readFileSync('apps/web/index.html','utf8').match(/<script>([\s\S]*?)<\/script>/)[1];console.log(c.createHash('sha256').update(h,'utf8').digest('base64'))"
    # Current hash (CRLF file): sha256-wdZA/lSyuTOvt4NF8r7xU2opYJ9Qrbtr/44+51FIPh4=
    # connect-src allows API + WebSocket (wss) + Cloudinary; img allows Cloudinary/Unsplash; fonts allow Google Fonts.
    # I-8: + form-action 'self' + upgrade-insecure-requests (2026 baseline). HSTS lives on :443 + API (helmet prod-only).
    # Vercel parity: vercel.json headers mirror this CSP (same hash + connect-src API/wss/Cloudinary).
    # connect-src 'self' covers the Vercel origin at runtime — keep FRONTEND_URL(S) + API_BASE_URL +
    # VITE_API_URL + VITE_SITE_URL + CSP connect-src in sync on move (see render.yaml + vercel.json).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-wdZA/lSyuTOvt4NF8r7xU2opYJ9Qrbtr/44+51FIPh4='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https://res.cloudinary.com https://images.unsplash.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://campusflow-api.onrender.com wss://campusflow-api.onrender.com https://res.cloudinary.com; frame-src https://www.loom.com https://loom.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'deny'; upgrade-insecure-requests" always;

    # Long-lived cache for hashed Vite assets — 1y immutable (popular-site parity)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /socket.io {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
