# Render Blueprint for CampusFlow
# Docs: https://render.com/docs/blueprint-spec
services:
  # Main API web service (embedded crons disabled; jobs run via Render Cron Jobs below)
  - type: web
    name: campusflow-api
    runtime: node
    # --include=dev: NODE_ENV=production (below) makes npm skip devDependencies,
    # but the build needs tsc and the pinned prisma CLI from devDependencies.
    # Try to install texlive for true pdflatex (Overleaf-quality). If host disallows apt, fallback gracefully to pdfkit + latexonline.cc cloud compile.
    buildCommand: (apt-get update -qq && apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-fonts-recommended lmodern > /dev/null 2>&1 && echo "texlive installed — local pdflatex enabled" || echo "texlive not installed — using latexonline.cc + pdfkit fallback") ; npm install --include=dev && npx prisma generate --schema=packages/backend/prisma/schema.prisma && npm run build -w packages/backend
    # Apply pending migrations before the new release goes live.
    preDeployCommand: npx prisma migrate deploy --schema=packages/backend/prisma/schema.prisma
    startCommand: node packages/backend/dist/index.js
    healthCheckPath: /api/health
    envVars:
      # Neon pooled URL REQUIRED: host must contain `-pooler` + `?sslmode=require&pgbouncer=true&connection_limit=10&pool_timeout=15`
      # Example: postgresql://user:pass@ep-xxx-pooler.c-5.us-east-2.aws.NEONHOST_REMOVED/neondb?sslmode=require&channel_binding=require&connect_timeout=15&pgbouncer=true&connection_limit=10&pool_timeout=15
      - key: DATABASE_URL
        sync: false
      # Neon direct URL (no -pooler, no pgbouncer) REQUIRED for `prisma migrate deploy` via datasource directUrl
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: DISABLE_EMBEDDED_CRON
        value: "true"
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  # Contest fetch - every 6 hours
  - type: cron
    name: campusflow-cron-contests
    schedule: "0 */6 * * *"
    command: curl -fsS -X POST https://campusflow-api.onrender.com/internal/cron/contests -H "x-cron-secret: $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Coding profile sync - hourly
  - type: cron
    name: campusflow-cron-profile-sync
    schedule: "0 * * * *"
    command: curl -fsS -X POST https://campusflow-api.onrender.com/internal/cron/profile-sync -H "x-cron-secret: $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Opportunity fetch + AI enrichment - every 12 hours
  - type: cron
    name: campusflow-cron-opportunities
    schedule: "0 */12 * * *"
    command: curl -fsS -X POST https://campusflow-api.onrender.com/internal/cron/opportunities -H "x-cron-secret: $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Cleanup old rejected items - Sundays at 3 AM UTC
  - type: cron
    name: campusflow-cron-cleanup
    schedule: "0 3 * * 0"
    command: curl -fsS -X POST https://campusflow-api.onrender.com/internal/cron/cleanup -H "x-cron-secret: $CRON_SECRET"
    envVars:
      - key: CRON_SECRET
        sync: false

  # Keep-alive ping every 5 min to prevent Render + Neon free tier cold sleep
  - type: cron
    name: campusflow-keepalive
    schedule: "*/5 * * * *"
    command: curl -fsS https://campusflow-api.onrender.com/api/health > /dev/null && echo "keepalive ok"
    envVars:
      - key: CRON_SECRET
        sync: false
